# Noctalia owns the idle timer; the desktop's existing lock and DPMS settings remain unchanged.
[idle.behavior.cmatrix-screensaver]
enabled = true
timeout = 300
action = "command"
command = "kitty --detach --start-as fullscreen --class cmatrix-screensaver -o background_opacity=1.0 cmatrix -a -b -s"
resume_command = "hyprctl dispatch closewindow 'class:^(cmatrix-screensaver)$'"
