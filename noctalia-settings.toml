[plugin_settings."noctalia/bitwarden"]
gen_passphrase_include_number = true
gen_special = true

[plugins]
enabled = [ "kenn/keybind-cheatsheet", "noctalia/bitwarden", "noctalia/translator" ]

[shell]
app_icon_color = "primary"
avatar_path = "/home/christopher/Pictures/Avatars/brute.png"
password_style = "random"
settings_window_translucent = true

    [shell.greeter_sync]
    auto_sync = true

    [shell.launcher]
    sort_by_usage = false

    [shell.panel]
    transparency_mode = "glass"

    [shell.window_switcher]
    style = "compact"

[system.monitor]
cpu_temp_activity_threshold = 75
cpu_temp_critical_threshold = 95

[theme]
builtin = "Noctalia"
custom_palette = "Cyberpunk"
mode = "dark"
source = "custom"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/christopher/Pictures/Backgrounds"

    [wallpaper.default]
    path = "/home/christopher/Pictures/Backgrounds/Desktop/cyberpunk.png"

    [wallpaper.last]
    path = "/home/christopher/Pictures/Backgrounds/Desktop/cyberpunk.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/christopher/Pictures/Backgrounds/Desktop/cyberpunk.png"

[weather]
unit = "imperial"

[widget.media]
hide_when_idle = true
show_progress = true
title_scroll = "always"

[widget.network]
show_label = false

[widget.tray]
capsule_fill = "surface_variant"

[widget.workspaces]
capsule_fill = "surface_variant"
show_labels = true