config_version = 15

[bar.default]
background_opacity = 0.59999998658895493
capsule = true
end = [ "media", "spacer_1", "tray", "group:g2", "privacy", "group:g3" ]
start = [ "clock", "weather", "spacer_1", "group:g1" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = ""
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "network", "bluetooth", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "control-center", "notifications", "session" ]
    opacity = 1.0
    padding = 6.0

[battery.device."/org/freedesktop/UPower/devices/headset_dev_84_9D_4B_EC_E7_D8"]
warning_threshold = 10

[battery.device."/org/freedesktop/UPower/devices/keyboard_dev_D4_CC_6E_3A_4A_87"]
warning_threshold = 10

[battery.device."/org/freedesktop/UPower/devices/mouse_dev_E5_59_5F_FB_09_6A"]
warning_threshold = 10

[brightness]
sync_all_monitors = true

[calendar]
dedupe_events = true
enabled = true

    [calendar.account.companycam_google]
