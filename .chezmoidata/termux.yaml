termux:
  enabled:
    - git
    - helix
    - go
    - rust
    - fish
    - hack-font
    - mitos
  editor: ms
  apps:
    git:
      targets:
        - .gitconfig
        - .gitignore
        - .config/bat
        - .config/bat/config
        - .config/bat/themes
        - .config/bat/themes/cyberpunk.tmTheme
      scripts:
        - rebuild-bat-cache.sh
    helix:
      scripts: []
      targets:
        - .config/helix
        - .config/helix/config.toml
        - .config/helix/languages.toml
        - .config/helix/themes
        - .config/helix/themes/cyberpunk.toml
    go:
      targets:
        - .config/fish
        - .config/fish/conf.d
        - .config/fish/conf.d/go.fish
      scripts: []
    rust:
      targets: []
      scripts: []
    fish:
      scripts: []
      targets:
        - .config/fish
        - .config/fish/config.fish
        - .config/fish/conf.d
        - .config/fish/conf.d/bat.fish
        - .config/fish/conf.d/chezmoi.fish
        - .config/fish/conf.d/environment.fish
        - .config/fish/conf.d/eza.fish
        - .config/fish/conf.d/fzf.fish
        - .config/fish/conf.d/git.fish
        - .config/fish/conf.d/modern-cli.fish
        - .config/fish/conf.d/paths.fish
        - .config/fish/functions
        - .config/fish/functions/fish_prompt.fish
        - .config/fish/functions/update.fish
        - .config/eza
        - .config/eza/theme.fish
        - .termux
        - .termux/shell
    hack-font:
      targets:
        - .termux
        - .termux/font.ttf
      scripts:
        - reload-termux-settings.sh
    mitos:
      scripts:
        - install-mitos.sh
      grammars:
        - bash
        - c
        - comment
        - cpp
        - diff
        - fish
        - git-config
        - git-rebase
        - gitattributes
        - gitcommit
        - gitignore
        - go
        - gomod
        - gotmpl
        - gowork
        - json
        - lua
        - markdown
        - markdown_inline
        - rust
        - toml
        - yaml
      targets:
        - .config/mitos
        - .config/mitos/**
        - .config/fish
        - .config/fish/completions
        - .config/fish/completions/ms.fish
        - .local
        - .local/bin
        - .local/bin/ms
        - .local/bin/journal-sync
        - .local/share
        - .local/share/mitos
        - .local/share/mitos/source-v0.1.2
        - .local/share/mitos/source-v0.1.2/**
        - .local/state
        - .local/state/mitos
        - .local/state/mitos/dictionaries
        - .local/state/mitos/dictionaries/en_US.txt
        - .local/state/mitos/dictionaries/gd_GB.txt
