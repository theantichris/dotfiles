# Curated Noctalia screenshot workflow. GUI overrides live in
# ~/.local/state/noctalia/settings.toml and should be reset when these values
# are intentionally managed here.

[shell.screenshot]
freeze_screen = true
annotate = false
save_to_file = false
copy_to_clipboard = true
pipe_to_command = true
pipe_command = '''swash --stdin --name "swash-$(date +'%Y-%m-%d_%H:%M:%S').png"'''
