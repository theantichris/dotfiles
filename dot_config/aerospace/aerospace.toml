config-version = 2
start-at-login = true
auto-reload-config = true

persistent-workspaces = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0']

# Keep small system utilities floating instead of letting them disrupt the tiled layout.
on-window-detected = [
    {
        if = 'test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = com.apple.calculator || test %{app-bundle-id} = com.apple.ActivityMonitor',
        run = 'layout floating',
    },
]

# Caps Lock is remapped by Karabiner to Control + Option + Command.
# Keep Shift free so Caps + Shift retains the same meaning as Super + Shift on Hyprland.
[mode.main.binding]
ctrl-alt-cmd-h = 'focus left'
ctrl-alt-cmd-j = 'focus down'
ctrl-alt-cmd-k = 'focus up'
ctrl-alt-cmd-l = 'focus right'

ctrl-alt-cmd-shift-h = 'move left'
ctrl-alt-cmd-shift-j = 'move down'
ctrl-alt-cmd-shift-k = 'move up'
ctrl-alt-cmd-shift-l = 'move right'

# Match the everyday Hyprland window actions.
ctrl-alt-cmd-q = 'close'
ctrl-alt-cmd-shift-space = 'layout floating tiling'
ctrl-alt-cmd-d = 'fullscreen'
ctrl-alt-cmd-f = 'macos-native-fullscreen'

# Match the everyday CachyOS launcher keys.
ctrl-alt-cmd-enter = 'exec-and-forget ~/.local/bin/kitty-cli-macos'
ctrl-alt-cmd-e = 'exec-and-forget ~/.local/bin/kitty-cli-macos spf'
ctrl-alt-cmd-t = 'exec-and-forget ~/.local/bin/kitty-cli-macos hx'
ctrl-alt-cmd-c = 'exec-and-forget ~/.local/bin/kitty-cli-macos qalc'
# Karabiner intercepts Caps + Shift + Escape before macOS sees its reserved
# Option + Command + Escape chord and converts it to an otherwise-unused F20.
f20 = 'exec-and-forget ~/.local/bin/kitty-cli-macos btop'
# Caps emits Option as part of Super. Zen/Firefox treats Option held at startup as
# a request for Troubleshoot Mode, so wait briefly for the key chord to release.
ctrl-alt-cmd-w = 'exec-and-forget sleep 0.35; open -a Zen'

# Kitty's native quick-access terminal is the macOS scratchpad.
# AeroSpace's exec-and-forget is already asynchronous, so kitty does not need --detach here.
ctrl-alt-cmd-backtick = 'exec-and-forget /Applications/kitty.app/Contents/MacOS/kitten quick-access-terminal'

# Workspaces 1-0, matching the CachyOS setup.
ctrl-alt-cmd-1 = 'workspace 1'
ctrl-alt-cmd-2 = 'workspace 2'
ctrl-alt-cmd-3 = 'workspace 3'
ctrl-alt-cmd-4 = 'workspace 4'
ctrl-alt-cmd-5 = 'workspace 5'
ctrl-alt-cmd-6 = 'workspace 6'
ctrl-alt-cmd-7 = 'workspace 7'
ctrl-alt-cmd-8 = 'workspace 8'
ctrl-alt-cmd-9 = 'workspace 9'
ctrl-alt-cmd-0 = 'workspace 0'

ctrl-alt-cmd-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
ctrl-alt-cmd-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
ctrl-alt-cmd-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
ctrl-alt-cmd-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
ctrl-alt-cmd-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
ctrl-alt-cmd-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
ctrl-alt-cmd-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
ctrl-alt-cmd-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
ctrl-alt-cmd-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
ctrl-alt-cmd-shift-0 = ['move-node-to-workspace 0', 'workspace 0']
