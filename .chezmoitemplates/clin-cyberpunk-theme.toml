[chrome]
accent       = "{{ .cyberpunk.accent.pink }}" # Accent 0 - selections, primary accent
heading      = "{{ .cyberpunk.accent.cyan }}" # Accent 1 - section headings
success      = "{{ .cyberpunk.semantic.success }}" # Semantic success
warning      = "{{ .cyberpunk.semantic.warning }}" # Semantic warning
destructive  = "{{ .cyberpunk.semantic.error }}" # Semantic error - deletions
muted        = "{{ .cyberpunk.text.muted }}" # Muted / secondary text
text         = "{{ .cyberpunk.text.primary }}" # Body text
fg           = "{{ .cyberpunk.terminal.bright.white }}" # Bright foreground
border       = "{{ .cyberpunk.accent.magenta }}" # Accent 2 - borders and dividers
tag          = "{{ .cyberpunk.accent.green }}" # Accent 3 - tag labels
folder       = "{{ .cyberpunk.semantic.info }}" # Info blue - folder names
highlight_fg = "{{ .cyberpunk.background.base }}" # Text on highlighted background
highlight_bg = "{{ .cyberpunk.accent.pink }}" # Selection highlight background

[graph]
nodes  = ["{{ .cyberpunk.accent.pink }}", "{{ .cyberpunk.accent.cyan }}", "{{ .cyberpunk.accent.magenta }}", "{{ .cyberpunk.accent.green }}", "{{ .cyberpunk.semantic.warning }}", "{{ .cyberpunk.semantic.error }}", "{{ .cyberpunk.semantic.info }}", "{{ .cyberpunk.syntax.number }}"]
chrome = "{{ .cyberpunk.text.muted }}" # Chrome / label color
title  = "{{ .cyberpunk.accent.cyan }}" # Graph title
text   = "{{ .cyberpunk.text.primary }}" # Graph text
fg     = "{{ .cyberpunk.terminal.bright.white }}" # Bright foreground
grid   = "{{ .cyberpunk.background.surface }}" # Grid lines
